name: release

# Fires when a tag of the form vX.Y.Z is pushed. The tag must match
# `VERSION_NAME` in gradle.properties or the job aborts before publishing
# (prevents a typo'd tag from minting a phantom version).
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag matches gradle version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag and gradle.properties
        id: extract
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          MCP_VERSION=$(node -p "require('./strictly-mcp/package.json').version")

          echo "tag:    $TAG_VERSION"
          echo "gradle: $GRADLE_VERSION"
          echo "mcp:    $MCP_VERSION"

          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match gradle.properties VERSION_NAME ($GRADLE_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$MCP_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match strictly-mcp/package.json version ($MCP_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: tests (gate on green)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :strictly:testDebugUnitTest :strictly-noop:testReleaseUnitTest --console=plain

  publish-maven-central:
    name: publish to Maven Central
    runs-on: ubuntu-latest
    needs: [verify, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/signing.asc

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(cat /tmp/signing.asc)"
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain

  publish-npm:
    name: publish strictly-mcp to npm
    runs-on: ubuntu-latest
    needs: [verify, test]
    defaults:
      run:
        working-directory: strictly-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Syntax check
        run: node --check index.js

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-maven-central, publish-npm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: create the release only if it doesn't exist. Manual
          # pre-created releases (the path you took for v0.1.0) are honoured.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Auto-published by the release workflow. See https://central.sonatype.com/artifact/io.github.vinaywadhwa.strictly/strictly/${GITHUB_REF_NAME#v} and https://www.npmjs.com/package/strictly-mcp."
          fi
