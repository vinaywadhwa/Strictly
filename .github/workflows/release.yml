name: release

# Fires automatically when a tag of the form vX.Y.Z is pushed.
# Can also be triggered manually via workflow_dispatch for a dry-run that
# exercises every step EXCEPT the actual upload to Maven Central + npm.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag matches gradle version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag and gradle.properties
        id: extract
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          MCP_VERSION=$(node -p "require('./strictly-mcp/package.json').version")

          echo "tag:    $TAG_VERSION"
          echo "gradle: $GRADLE_VERSION"
          echo "mcp:    $MCP_VERSION"

          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match gradle.properties VERSION_NAME ($GRADLE_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$MCP_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match strictly-mcp/package.json version ($MCP_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: tests (gate on green)
    runs-on: ubuntu-latest
    needs: verify
    # 'always() && success-or-skipped' lets test run on workflow_dispatch
    # where verify is skipped by design (no tag to verify against).
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :strictly:testDebugUnitTest :strictly-noop:testReleaseUnitTest --console=plain

  dry-publish:
    name: dry-run publish (no uploads)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # ---- Maven side dry-run ----
      # Decode the signing key the same way the real publish does, so we
      # catch base64 / encoding mistakes here rather than in production.
      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/signing.asc

      - name: Maven dry-run (publishToMavenLocal)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(cat /tmp/signing.asc)"
          # publishToMavenLocal signs + builds every artifact (.aar, .pom,
          # .module, sources jar, javadoc jar) and writes them to ~/.m2.
          # Exercises: signing plumbing, POM validity, all required artifacts.
          # Does NOT exercise: Sonatype-side validation (that's irreducible).
          ./gradlew publishToMavenLocal --no-configuration-cache --console=plain

      - name: Maven dry-run output sanity
        run: |
          GROUP=io/github/vinaywadhwa/strictly
          VERSION=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          for ART in strictly strictly-noop; do
            DIR="$HOME/.m2/repository/$GROUP/$ART/$VERSION"
            echo "--- $ART ---"
            ls -1 "$DIR" || { echo "::error::expected $DIR to exist"; exit 1; }
            # Every required satellite file plus its .asc signature must be present.
            for SUFFIX in ".pom" ".aar" "-sources.jar" "-javadoc.jar" ".module"; do
              FILE="$DIR/$ART-$VERSION$SUFFIX"
              [ -f "$FILE" ] || { echo "::error::missing $FILE"; exit 1; }
              [ -f "$FILE.asc" ] || { echo "::error::missing signature $FILE.asc"; exit 1; }
            done
          done
          echo "all artifacts + signatures present"

      # ---- npm side dry-run ----
      - name: npm dry-run
        working-directory: strictly-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # --dry-run validates package shape + auth without uploading.
          npm publish --access public --dry-run

  publish-maven-central:
    name: publish to Maven Central
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, dry-publish]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/signing.asc

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(cat /tmp/signing.asc)"
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --console=plain

  publish-npm:
    name: publish strictly-mcp to npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, dry-publish]
    defaults:
      run:
        working-directory: strictly-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Syntax check
        run: node --check index.js

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: attach artifacts to GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [publish-maven-central, publish-npm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: create the release only if it doesn't exist. Manual
          # pre-created releases (the path you took for v0.1.0) are honoured.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Auto-published by the release workflow. See https://central.sonatype.com/artifact/io.github.vinaywadhwa.strictly/strictly/${GITHUB_REF_NAME#v} and https://www.npmjs.com/package/strictly-mcp."
          fi
